<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎙️ My Podcast Studio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🎙️ My Podcast Studio</h1>
    <p>Create or Join a Video Call Room</p>

    <input type="text" id="roomInput" placeholder="Enter Room Name" />
    <button id="createRoom">Create Room</button>
    <button id="joinRoom">Join Room</button>
  </div>

  <script>
    document.getElementById("createRoom").onclick = () => {
      const room = document.getElementById("roomInput").value.trim() || "room-" + Math.random().toString(36).substring(2, 8);
      window.location.href = `podcast.html#${room}`;
    };

    document.getElementById("joinRoom").onclick = () => {
      const room = document.getElementById("roomInput").value.trim();
      if (!room) return alert("Enter a room name to join");
      window.location.href = `podcast.html#${room}`;
    };
  </script>
</body>
</html>
